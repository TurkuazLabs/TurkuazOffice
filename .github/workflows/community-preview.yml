# 📄 Dosya Yolu: E:/Projects/TurkuazOffice/.github/workflows/community-preview.yml
# 📌 Amac: Community Writer Preview icin Windows raw EXE ve Linux DEB/AppImage paketlerini gercek CI runner'larinda uretir
# 📌 Modul - FileType: Config - YAML
# Version: 0.3.5
# Aciklama: Pull request ve manuel calistirmalarda TurkuazInstaller icin ham EXE, SHA-256 checksum ve GitHub Actions artifactlari uretir
# Bagimli Oldugu Katman: CI | Distribution

name: community-preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/community-preview.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".github/workflows/community-preview.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    name: Windows raw EXE payload
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      # @dev-id TO-TI-RAW-EXE-001
      # TurkuazInstaller integration input; not an installable setup.
      - name: Build Windows application without NSIS
        working-directory: apps/desktop
        run: npm run tauri:build:windows

      - name: Stage raw Windows payload and checksums
        shell: pwsh
        run: |
          $source = 'target/release/turkuaz-office-desktop.exe'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'Expected raw Turkuaz Office Windows executable was not produced.'
          }
          $out = 'dist/turkuaz-installer-payload'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $out 'turkuaz-office-desktop.exe')
          $file = Join-Path $out 'turkuaz-office-desktop.exe'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          "$hash  turkuaz-office-desktop.exe" | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload TurkuazInstaller source payload
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-office-community-windows-raw-payload
          path: dist/turkuaz-installer-payload/
          if-no-files-found: error

      # @dev-id TO-TI-SETUP-002
      # Pin installer engine; never download an unverified 'latest' executable.
      - name: Checkout pinned TurkuazInstaller v0.2.24
        uses: actions/checkout@v5
        with:
          repository: TurkuazLabs/TurkuazInstaller
          ref: 10101dee8b6efe4775f5cf72aa05f3a3da934bfa
          path: turkuaz-installer-source
          persist-credentials: false

      # @dev-id TI-COMMAND-SUBSYSTEM-001
      # Console CLI runs commands; GUI-subsystem stub is embedded into Setup.
      - name: Build separate GUI stub and console CLI
        shell: pwsh
        run: |
          $manifest = 'turkuaz-installer-source/rust/Cargo.toml'
          $bin = 'turkuaz-installer-source/rust/target/release/turkuaz-installer.exe'
          $stub = 'turkuaz-installer-source/rust/target/release/turkuaz-installer-studio.exe'
          cargo build --locked --manifest-path $manifest -p turkuaz-installer-cli --release --bin turkuaz-installer --features setup-authoring-gui
          if ($LASTEXITCODE -ne 0) { throw 'TurkuazInstaller GUI stub build failed.' }
          Copy-Item -LiteralPath $bin -Destination $stub -Force
          cargo build --locked --manifest-path $manifest -p turkuaz-installer-cli --release --bin turkuaz-installer --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'TurkuazInstaller console CLI build failed.' }
          if (-not (Test-Path -LiteralPath $stub -PathType Leaf)) { throw 'GUI stub missing.' }

      - name: Create TurkuazInstaller package and native setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'turkuaz-installer-source/rust/target/release/turkuaz-installer.exe'
          $source = 'dist/turkuaz-installer-payload'
          $out = 'dist/turkuaz-installer'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          # The archive must contain only application payload, not its checksum.
          $payload = Join-Path $out 'payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $source 'turkuaz-office-desktop.exe') -Destination (Join-Path $payload 'turkuaz-office-desktop.exe')
          & $cli build-package --package-id com.turkuazlabs.office --version 0.3.1 --source $payload --output (Join-Path $out 'TurkuazOffice.tzpkg') --executable turkuaz-office-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw 'TurkuazInstaller build-package failed.' }
          & $cli build-native-setup --stub 'turkuaz-installer-source/rust/target/release/turkuaz-installer-studio.exe' --package (Join-Path $out 'TurkuazOffice.tzpkg') --output (Join-Path $out 'TurkuazOffice-Setup.exe')
          if ($LASTEXITCODE -ne 0) { throw 'TurkuazInstaller build-native-setup failed.' }
          $files = @('TurkuazOffice.tzpkg', 'TurkuazOffice-Setup.exe')
          $hashes = foreach ($name in $files) {
            $full = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $full -PathType Leaf)) { throw "Missing TurkuazInstaller output: $name" }
            $hash = (Get-FileHash -LiteralPath $full -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashes | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload TurkuazInstaller Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-office-community-turkuaz-installer-v0.2.24
          path: |
            dist/turkuaz-installer/TurkuazOffice.tzpkg
            dist/turkuaz-installer/TurkuazOffice-Setup.exe
            dist/turkuaz-installer/SHA256SUMS.txt
          if-no-files-found: error

  linux-preview:
    name: Linux DEB AppImage preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tauri Linux Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install Frontend Dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund

      - name: Build Linux Bundles
        working-directory: apps/desktop
        run: npm run tauri:build:linux

      - name: Create Linux Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd target/release/bundle
          shopt -s nullglob
          files=(
            deb/*.deb
            appimage/*.AppImage
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Linux bundle artifacts were not produced." >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Upload Linux Preview
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-office-community-linux-preview
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
