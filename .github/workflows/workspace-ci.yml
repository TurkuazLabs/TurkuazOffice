# 📄 Dosya Yolu: E:/Projects/TurkuazOffice/.github/workflows/workspace-ci.yml
# 📌 Amac: Rust Core/Writer/Sheet/Web bridge, Desktop, M3 Web ve generated WASM binding artifact kalite kontrollerini calistirir
# 📌 Modul - FileType: Config - YAML
# Version: 0.4.0
# Aciklama: Desktop/Web build-test, project contract, Rust quality, wasm32 Core+Web bridge check, generated aggregate binding artifact ve iki platformlu workspace testlerini dogrular
# Bagimli Oldugu Katman: CI

name: workspace-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck And Build
        run: npm run build

      - name: Frontend Unit Tests
        run: npm test


  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Web Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck And Build
        run: npm run build

      - name: Web Unit Tests
        run: npm test


  wasm-artifact:
    name: Web WASM artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build Generated Web WASM
        run: bash ./tools/build-web-wasm.sh

      - name: Upload Web WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-office-web-wasm
          path: apps/web/public/wasm/
          if-no-files-found: error

  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri Linux Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Project Contract
        run: ./tools/verify-project.sh

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: WASM Core Check
        run: cargo check -p turkuaz-office-core --target wasm32-unknown-unknown --features web-wasm-exports

      - name: WASM Web Bridge Check
        run: cargo check -p turkuaz-office-web-bridge --target wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::all

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri Linux Prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Test Workspace
        run: cargo test --workspace
