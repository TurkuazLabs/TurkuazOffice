# 📄 Dosya Yolu: E:/Projects/TurkuazOffice/config/project.yml
# 📌 Amac: Platform kapsamini, native belge kontratini ve aktif foundation hardening kurallarini merkezi konfigurasyonda tanimlar
# 📌 Modul - FileType: Config - YAML
# Version: 0.3.1
# Aciklama: Platform, schema, guvenlik, kalite, Sheet Desktop ve M3 Web WASM runtime foundation kararlarini merkezi proje konfigurasyonunda toplar
# Bagimli Oldugu Katman: Config

project:
  name: TurkuazOffice
  owner: TurkuazLabs
  version: 0.3.1

platforms:
  active:
    - windows
    - linux
  planned:
    - macos
    - web
    - android
    - ios

modules:
  active:
    - core
    - document
    - schema_migration
    - writer
    - sheet
    - format_adapters
  planned:
    - slides
    - plugin
    - cloud
    - collaboration

native_document:
  extension: .tko
  current_schema_version: 1
  macros_enabled: false

  package_v1:
    container: zip
    compression: stored
    manifest_entry: manifest.yml
    writer_content_entry: content/writer.yml
    unknown_file_entries_allowed: false
    directory_entries_allowed: false
    domain_serde_coupled: false

architecture:
  controller_logic_allowed: false
  magic_strings_allowed: false
  inline_config_allowed: false
  docs_required_for_architecture_change: true
  canonical_model_format_independent: true
  offline_first_contract_required: true

quality:
  accessibility_required: true
  keyboard_first_required: true
  performance_budget_required: true
  untrusted_document_limits_required: true


desktop_ui:
  shell: tauri_2
  framework: solidjs
  language: typescript
  build_tool: vite
  canonical_state_in_frontend: false
  ipc_thin_bridge_required: true

web_client:
  active: true
  milestone: m3_foundation
  target_version: 0.4.0
  framework: solidjs
  language: typescript
  build_tool: vite
  metadata_index_adapter: local_storage
  document_storage_adapter: indexed_db_planned
  canonical_document_payload_in_local_storage: false
  native_file_system_access: false
  core_bridge: tool_boundary
  wasm_core: compile_verified
  wasm_target: wasm32-unknown-unknown
  wasm_binding: runtime_loader_foundation
  wasm_binding_url: /wasm/turkuaz_office_core.js
  import_export: planned
  offline_cache: planned

writer_input:
  surface: contenteditable
  canonical_state_in_dom: false
  selection_offset_unit: unicode_scalar
  ime_transaction_boundary: composition_events
  rich_text_baseline:
    - bold
    - italic
    - underline
    - font_family
    - font_size_half_points
  typing_style:
    canonical: false
    repository_session_state: true
    materialize_on_text_insert: true
  paragraph_baseline:
    - align_left
    - align_center
    - align_right
    - align_justify
  ribbon:
    active_tab: home
    tabs:
      - file
      - home
      - insert
      - view

desktop_storage:
  active: true
  local_first: true
  direct_target_truncate_allowed: false
  unsaved_change_guard: true
  safe_replace:
    unix: temp_sync_rename
    windows: temp_sync_backup_replace_rollback


desktop_recovery:
  active: true
  snapshot_format: tko_v1
  metadata_format: yaml
  overwrite_source_on_autosave: false
  autosave_interval_ms: 30000
  max_snapshots_per_document: 5
  max_age_seconds: 604800
  startup_decision_required: true
  actions:
    - recover
    - compare
    - discard


desktop_file_protection:
  active: true
  fingerprint: content_hash_and_length
  timestamp_only_detection: false
  lock_strategy: cooperative_sidecar
  lock_failure_mode: read_only
  backend_mutation_guard: true
  external_change_poll_ms: 2000
  overwrite_requires_explicit_keep_local: true
  save_as_allowed_when_read_only: true
  actions:
    - reload_from_disk
    - keep_local_version
    - save_as

writer_layout:
  active: true
  canonical_unit: twip
  css_reference_dpi: 96
  device_dpi_changes_document_geometry: false
  zoom_session_only: true
  zoom_min_percent: 50
  zoom_max_percent: 200
  zoom_step_percent: 10
  font_resolution_changes_document_family: false
  browser_dom_measurement_is_canonical: false
  primary_section_page_settings_in_view: true


writer_print:
  active: true
  preview_source: canonical_writer_document
  preview_zoom_percent: 100
  canonical_page_unit: twip
  platform_adapter: system_print_dialog
  printer_discovery: delegated_to_system_dialog
  system_dialog_controls:
    - printer
    - page_range
    - copies
    - orientation
    - paper_size
    - margin
    - scale


writer_docx:
  active: true
  mode: import_export_adapter
  native_session_format: false
  package:
    container: zip
    compression_read:
      - stored
      - deflate
    compression_write: deflate
  supported:
    - paragraph_text
    - bold
    - italic
    - underline
    - font_family
    - font_size_half_points
    - paragraph_alignment
    - primary_page_size
    - primary_page_margins
    - tab
    - line_break
  compatibility_report_required: true
  strict_export_on_unsupported_structure: true


writer_pdf:
  active: true
  mode: export_adapter
  canonical_page_unit: twip
  font_source: desktop_system_font_tool
  font_embedding: true
  font_subsetting: true
  pagination: adapter_local_m1_baseline
  supported:
    - paragraph_text
    - bold
    - italic
    - underline
    - font_family
    - font_size_half_points
    - paragraph_alignment
    - primary_page_size
    - primary_page_margins
    - tab
    - line_break
    - multi_page_text_flow
  strict_export_on_unsupported_structure: true


desktop_recent_files:
  active: true
  native_extension: .tko
  metadata_format: yaml
  metadata_file: recent-files.yml
  path_normalization: canonical
  prune_missing: true
  max_entries: 12
  ribbon_quick_open_entries: 3


desktop_file_associations:
  active: true
  native_extension: .tko
  mime_type: application/x-turkuaz-office
  cold_start_open: true
  recovery_precedence: true
  running_instance_handoff: false
  windows:
    installer_target: nsis
    association_supported: true
  linux:
    installer_target: deb
    portable_target: appimage
    deb_association_supported: true
    appimage_association_guaranteed: false


writer_templates:
  active: true
  source: built_in_yaml
  catalog_version: 1
  offline: true
  built_in:
    - blank
    - letter
    - report
  quick_create_metadata: true
  user_templates: false
  cloud_templates: false
  dynamic_fields: false


desktop_localization:
  active: true
  default_locale: tr-TR
  supported_locales:
    - tr-TR
    - en-US
  runtime_switch: true
  preference_storage: local_storage
  view_direct_storage_access: false
  ui_locale_is_document_locale: false


desktop_keyboard_smoke:
  active: true
  typed_shortcut_resolver: true
  ctrl_meta_parity: true
  ime_blocking: true
  recovery_blocking: true
  print_preview_isolation: true
  aria_keyshortcuts: true
  focus_visible_required: true
  manual_smoke_required: true


sheet_cell_model:
  active: true
  storage: sparse
  address_model: zero_based_row_column
  a1_reference_tool: true
  max_rows: 1048576
  max_columns: 16384
  max_text_length: 32767
  values:
    - text
    - number
    - boolean
    - formula
  formula_engine: true


sheet_formula_engine:
  active: true
  prefix: "="
  references:
    scope: same_worksheet
    simple_a1: true
    absolute_and_mixed_a1: true
    cross_worksheet: false
    empty_cell_numeric_value: 0
  operators:
    - add
    - subtract
    - multiply
    - divide
  parentheses: true
  unary_plus_minus: true
  functions: false
  text_boolean_numeric_coercion: false
  cycle_detection: true
  max_expression_length: 4096
  max_parse_depth: 64
  max_operations: 128
  max_dependency_depth: 64


sheet_csv_xlsx:
  active: true
  csv:
    encoding: utf8
    delimiter: comma
    import_semantics: text_only
    export_values:
      - text
      - number
      - boolean
    max_bytes: 16777216
  xlsx:
    mode: value_only
    package: zip
    compression_read:
      - stored
      - deflate
    compression_write: deflate
    text_export: inline_string
    text_import:
      - inline_string
      - shared_string
    values:
      - text
      - number
      - boolean
    multiple_worksheets: true
    formula_import: strict_reject
    max_package_bytes: 67108864
    max_worksheets: 256


sheet_format_filter_sort:
  active: true
  format:
    sparse: true
    bold: true
    italic: true
    underline: true
    horizontal_alignment:
      - general
      - left
      - center
      - right
    max_decimal_places: 12
  filter:
    non_empty: true
    text_contains: true
    number_compare: true
    boolean_equals: true
    formula_evaluation: true
  sort:
    single_column: true
    ascending: true
    descending: true
    mutates_canonical_rows: false
  max_query_rows: 100000


sheet_basic_charts:
  active: true
  canonical_definition: true
  types:
    - bar
    - line
    - pie
  category_type: text
  value_types:
    - number
    - formula_numeric
  max_points: 1000
  render_engine: none


sheet_100k_benchmark:
  active: true
  cell_count: 100000
  storage: sparse_btree_map
  workloads:
    - sparse_build
    - view_projection
    - sorted_row_query
  explicit_only: true
  fixed_ci_latency_threshold: false


community_preview:
  version: 0.3.1
  channel: preview
  signed_release: false
  windows_bundle: nsis
  linux_bundles:
    - deb
    - appimage
  writer_desktop:
    active: true
    release_candidate: true
  sheet_engine:
    active: true
    desktop_ui_integrated: true
  required_gates:
    - frontend_build
    - frontend_tests
    - cargo_check
    - cargo_fmt
    - cargo_clippy
    - rust_tests_windows
    - rust_tests_linux
    - windows_nsis_bundle
    - linux_deb_bundle
    - linux_appimage_bundle
    - sha256_checksums
