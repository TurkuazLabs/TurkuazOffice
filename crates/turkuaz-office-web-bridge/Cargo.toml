# 📄 Dosya Yolu: E:/Projects/TurkuazOffice/crates/turkuaz-office-web-bridge/Cargo.toml
# 📌 Amac: Web browser WASM aggregate bridge crate bagimliliklarini tanimlar
# 📌 Modul - FileType: Config - TOML
# Version: 0.4.0
# Aciklama: Core capability ve Writer TKO codec yuzeylerini tek wasm-bindgen cdylib artifactinda birlestirir
# Bagimli Oldugu Katman: Config

[package]
name = "turkuaz-office-web-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
turkuaz-office-core = { path = "../turkuaz-office-core" }
turkuaz-office-writer = { path = "../turkuaz-office-writer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[lib]
name = "turkuaz_office_web_bridge"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true
