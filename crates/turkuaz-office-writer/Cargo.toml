[package]
name = "turkuaz-office-writer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
turkuaz-office-core = { path = "../turkuaz-office-core" }
serde = { version = "1.0", features = ["derive"] }
noyalib = { version = "=0.0.5", default-features = false, features = ["std", "compat-serde-yaml"] }
zip = { version = "=6.0.0", default-features = false }

[lib]
name = "turkuaz_office_writer"
path = "src/lib.rs"

