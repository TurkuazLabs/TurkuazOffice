# 📄 Dosya Yolu: E:/Projects/TurkuazOffice/apps/desktop/src-tauri/Cargo.toml
# 📌 Amac: Turkuaz Office Desktop Tauri Rust shell crate bagimliliklarini tanimlar
# 📌 Modul - FileType: Config - TOML
# Version: 0.4.1
# Aciklama: Tauri 2.11.x shell, serde DTO, Writer ve Sheet domain bagimliliklarini workspace'e baglar
# Bagimli Oldugu Katman: Config

[package]
name = "turkuaz-office-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "turkuaz_office_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "turkuaz-office-desktop"
path = "src/main.rs"

[features]
default = []
installer-velopack-pilot = ["dep:velopack"]

[target.'cfg(windows)'.dependencies]
velopack = { version = "=1.2.161", optional = true }

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["config-json5"] }

[dependencies]
fontdb = "=0.24.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = ["config-json5"] }
tauri-plugin-dialog = "=2.7.3"
turkuaz-office-writer = { path = "../../../crates/turkuaz-office-writer" }
turkuaz-office-sheet = { path = "../../../crates/turkuaz-office-sheet" }
turkuaz-office-format-adapters = { path = "../../../crates/turkuaz-office-format-adapters" }

[lints]
workspace = true
